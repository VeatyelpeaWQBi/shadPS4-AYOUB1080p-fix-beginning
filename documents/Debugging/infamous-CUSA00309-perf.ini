# Optional compatibility profile for the existing AYOUB 1.0 executable.
# Copy/merge into the emulator USER directory as perf_tuning.ini, before launching.
# This file affects every game sharing that user directory while it is installed.
# A build of the adapted source applies these optimizations to CUSA00309 automatically.
readback_write_discard = 1
async_pipelines = 1
readback_queue = 1
stream_dedup = 1
stream_static = 1
gpu_clock_div = 10
asc_yield_packets = 16
real_occlusion = 1
wave_memory_barriers = 1
threaded_recording = 1
async_uploads = 1
recorder_spin_us = 200
sync_memo = 1
spec_memo = 1
gpu_clock_frame_us = 16667
region_summary = 1
tex_memo = 1
async_written_uploads = 1
skip_redundant_binds = 1
shader_params_memo = 1
runtime_lookup_memo = 1
skip_empty_draws = 1
pipeline_key_memo = 1
bind_prefetch = 1
gpu_threads_affinity = auto
rt_memo = 1
late_protect = 1
parallel_protect = 1
# Bounded log output is configured by the diagnostic per-game JSON.
perf_log = 1
profile_stacks = 1
dump_frames = 0
